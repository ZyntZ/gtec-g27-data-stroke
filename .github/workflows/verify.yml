name: Verify source and saved results

on:
  pull_request:
  push:
    branches: [main, codex/pr-reliability]
  merge_group:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e '.[test,verification,accuracy]'
      - name: Check source and saved receipts together
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q
      - name: Reject tracked recordings and failed notebooks
        run: python tools/repo_preflight.py
      - name: Validate published accuracy arithmetic
        run: python analysis/accuracy_calibration/validate.py
