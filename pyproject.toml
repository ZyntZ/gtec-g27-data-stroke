[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gtec-g27-stroke"
version = "0.1.0"
description = "Leakage-aware motor imagery benchmarks for the BR41N.IO Stroke Rehab dataset"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2",
  "matplotlib>=3.7,<4", "requests>=2.28,<3", "libarchive-c>=5,<6",
]

[project.optional-dependencies]
test = ["pytest>=7,<10"]

[project.scripts]
stroke-rehab = "stroke_rehab.cli:main"

[tool.setuptools.packages.find]
include = ["stroke_rehab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
